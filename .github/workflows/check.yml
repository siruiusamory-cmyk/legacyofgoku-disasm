name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python tools/check_links.py
      - run: python tools/lint/lints.py
      - name: whole suite, one file per process
        run: |
          status=0
          for file in $(git ls-files | grep -E '(^|/)test_[^/]*\.py$'); do
            python -m pytest -q "$file" || status=1
          done
          exit $status
